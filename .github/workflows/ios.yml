name: Build iOS app

# Builds the Capacitor iOS wrapper on a free macOS runner, so no Mac is required locally.
# The simulator build needs no Apple account at all; a device .ipa needs signing secrets.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  simulator:
    name: Build for simulator (no signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: espresso-english/package-lock.json

      - name: Install web dependencies
        working-directory: espresso-english
        run: npm ci

      - name: Build the web bundle
        working-directory: espresso-english
        run: npm run build

      - name: Copy the bundle into the native project
        working-directory: espresso-english
        run: npx cap sync ios

      - name: Build with xcodebuild
        working-directory: espresso-english/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            MARKETING_VERSION=5.4.1 \
            CURRENT_PROJECT_VERSION=10 \
            CODE_SIGNING_ALLOWED=NO

      - name: Package the .app
        working-directory: espresso-english/ios/App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qry Espresso-English-simulator.zip App.app

      - uses: actions/upload-artifact@v4
        with:
          name: Espresso-English-simulator
          path: espresso-english/ios/App/build/Build/Products/Release-iphonesimulator/Espresso-English-simulator.zip
          retention-days: 14

# A signed .ipa needs an Apple Developer account and four repository secrets
# (certificate, password, provisioning profile, team id). The exact steps live in
# docs/IOS-FA.md — add that job back once the account exists.
