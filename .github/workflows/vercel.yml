name: Deploy to Vercel

# Optional mirror of the GitHub Pages deployment. Runs only when the VERCEL_TOKEN secret exists.
# Add it in: Settings → Secrets and variables → Actions → New repository secret
#   VERCEL_TOKEN      https://vercel.com/account/tokens
#   VERCEL_ORG_ID     from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID from .vercel/project.json after `vercel link`

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the token
        id: gate
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: site

      - name: No token yet
        if: steps.gate.outputs.ok != 'true'
        run: echo "VERCEL_TOKEN is not set — skipping. See docs/VERCEL-FA.md"
