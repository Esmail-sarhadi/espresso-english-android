# Gradle/Kotlin 2.2 cannot parse Java 25 ("IllegalArgumentException: 25").
# Pin the build JVM to the JBR 21 bundled with Android Studio so `./gradlew` works
# regardless of the shell's default java (which may be 21-incompatible JDK 25).
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
